[package]
name = "c2pa-mcp-rs"
version = "0.1.0"
edition = "2021"
description = "MCP server for reading C2PA Content Credentials using the official c2pa Rust library"
license = "MIT OR Apache-2.0"

[dependencies]
c2pa = { version = "0.77", features = ["file_io"] }
mcp-protocol-sdk = { version = "0.5", default-features = false, features = ["stdio"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tempfile = "3"
thiserror = "2"
trustmark = "0.2"
image = "0.25"
urlencoding = "2"

[profile.release]
lto = true
codegen-units = 1
